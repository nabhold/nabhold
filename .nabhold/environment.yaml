# Nabhold development-environment declaration
#
# Conforms to:
#   nabhold/shared/contracts/development-environment/schema.yaml (v1.0)
# Governing decision:
#   nabhold/shared/docs/adr/ADR-0001
#
# The application and entity identifiers are repository-specific. The
# environment profile and compatibility policy are organisational standards.

schema:
  name: "nabhold-development-environment-contract"
  version: "1.0"

application:
  name: "nabhold"
  version: "0.1.0"
  entity_id: "NABHOLD"

environment:
  provider: "baobab-dev"
  profile: "frontend"
  minimum_version: "1.2.6-frontend"
  contract_minimum_version: "1.0"

compatibility_policy:
  strict_runtime_versions: true
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false

validation:
  required_capabilities:
    - "languages.node"
    - "package_managers.pnpm"
    - "development.github_cli"
    - "frontend_tooling.turbo"

  excluded_capabilities:
    - name: "python"
      reason: "This digital estate builds no Python code."
    - name: "flutter"
      reason: "This digital estate builds no Flutter code."
    - name: "postgresql"
      reason: "The frontend owns no local database and consumes Baobab through explicit APIs."
    - name: "uv"
      reason: "No Python package management is required."
    - name: "poetry"
      reason: "No Python package management is required."
    - name: "docker"
      reason: "The frontend profile supplies the application toolchain; production container concerns remain separate."
    - name: "cosign"
      reason: "Image signing belongs to the baobab-dev publication pipeline."

notes:
  - "GitHub Codespaces and local Dev Containers use ghcr.io/nabhold/baobab-dev:1.2.6-frontend."
  - "Browser-dependent CI uses the separately published 1.2.6-frontend-e2e profile."
  - "This repository consumes Baobab capabilities through APIs and canonical contracts; it never accesses Baobab-owned databases."
