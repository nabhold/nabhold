name: Bug report
description: Report a reproducible defect in the Nabhold digital estate.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reliable sequence that reproduces the defect.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Codespaces, local Dev Container, preview, or production
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include logs, screenshots, or failing checks with secrets removed.
